[package]
name = "aizome-uta"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Uta 歌, a native YouTube Music client for Aizome"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitemyapp/uta"

[dependencies]
aizome-kit = { path = "../aizome/crates/aizome-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tempfile = "3"
libc = "0.2"
ureq = "3"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.dev.package.tiny-skia]
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 4
